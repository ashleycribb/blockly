<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" value="notranslate">
  <title>Blockly Demo: Smart Contracts</title>
  <link rel="stylesheet" href="style.css">
  <script src="/storage.js"></script>
  <script src="../../dist/blockly_compressed.js"></script>
  <script src="../../dist/blocks_compressed.js"></script>
  <script src="../../dist/solidity_compressed.js"></script>
  <script src="templates.js"></script>
  <script src="code.js"></script>
</head>
<body>
  <div id="header">
    <h1><a href="https://developers.google.com/blockly/">Blockly</a> &gt; Smart Contracts</h1>
    <div id="toolbar">
      <select id="templateMenu"></select>
      <button id="openButton">Open</button>
      <button id="saveButton">Save</button>
      <button id="runButton">Run</button>
    </div>
  </div>
  <div id="content_area">
    <div id="content_blocks" class="content"></div>
    <div id="content_solidity" class="content">
      <button id="copyButton">Copy</button>
      <pre class="prettyprint lang-sol"></pre>
    </div>
    <div id="content_xml" class="content"></div>
  </div>
  <div id="statusbar">
    <span id="status">Ready</span>
  </div>

  <xml xmlns="https://developers.google.com/blockly/xml" id="toolbox" style="display: none">
    <category name="Contracts" colour="%{BKY_LOGIC_HUE}">
      <block type="contract"></block>
      <block type="state_variable"></block>
      <block type="function"></block>
      <block type="constructor"></block>
      <block type="return"></block>
      <block type="require"></block>
      <block type="assert"></block>
      <block type="revert"></block>
    </category>
  </xml>

</body>
</html>
